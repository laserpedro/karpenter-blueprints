apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      nodeSelector:
        intent: gpu-fast-model-loading
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: models
          hostPath:
            path: /mnt/k8s-disks/0/models
            type: DirectoryOrCreate
        # torch.compile / Triton artifacts, kept on the NVMe array so the next
        # pod on this node skips the compilation step (~1 min on large models).
        - name: compile-cache
          hostPath:
            path: /mnt/k8s-disks/0/compile-cache
            type: DirectoryOrCreate
        # NCCL needs a large shared memory segment for tensor parallelism.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
      containers:
        - name: vllm
          # Amazon Deep Learning Container for vLLM (~10 GB), the same image used
          # in the soci-snapshotter blueprint.
          image: 763104351884.dkr.ecr.us-east-1.amazonaws.com/vllm:0.9-gpu-py312-ec2
          # The wait for the weights happens *inside* the container rather than
          # in an init container on purpose: the kubelet only pulls a container
          # image right before starting that container, so an init container
          # would delay the 10 GB image pull until the download is over. This
          # way the SOCI image pull and the S3 download run in parallel.
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -eu
              MODEL="/models/<<MODEL_PATH>>"
              DEADLINE=$(( $(date +%s) + MODEL_WAIT_TIMEOUT_SECONDS ))
              until [ -f "${MODEL}/.ready" ]; do
                if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                  echo "ERROR: ${MODEL}/.ready did not appear within ${MODEL_WAIT_TIMEOUT_SECONDS}s, check the model-preloader logs"
                  exit 1
                fi
                echo "waiting for model-preloader to finish downloading ${MODEL}"
                sleep 5
              done
              echo "model ready, starting vLLM"
              exec python3 -m vllm.entrypoints.openai.api_server \
                --model="${MODEL}" \
                --served-model-name=model \
                --tensor-parallel-size="${TENSOR_PARALLEL_SIZE}" \
                --host=0.0.0.0 \
                --port=8000
          ports:
            - name: http
              containerPort: 8000
          env:
            # Give up if the preloader has not delivered the weights in time.
            - name: MODEL_WAIT_TIMEOUT_SECONDS
              value: "1800"
            # One shard per GPU of a p5.48xlarge. Keep in sync with nvidia.com/gpu below.
            - name: TENSOR_PARALLEL_SIZE
              value: "8"
            # Persist torch.compile and Triton kernels on the node's NVMe array.
            - name: XDG_CACHE_HOME
              value: /compile-cache
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /compile-cache/inductor
            - name: TRITON_CACHE_DIR
              value: /compile-cache/triton
          # Must cover the wait for the download plus weight loading and
          # torch.compile on a cold node: 30s + 300 x 10s = 50 minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 300
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "32"
              memory: 256Gi
            limits:
              nvidia.com/gpu: 8
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: compile-cache
              mountPath: /compile-cache
            - name: shm
              mountPath: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
spec:
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
