apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: weekend-scaling
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
    # Block ALL disruption during the workweek (Mon 08:00 → Fri 18:00 UTC).
    # Workloads that cannot tolerate consolidation (e.g. stateful services,
    # strict PDBs, or latency-sensitive apps) must never be disrupted mid-week.
    - nodes: "0"
      schedule: "0 8 * * 1"
      duration: 106h
    # Allow 100% disruption over the full weekend (Fri 18:00 → Mon 08:00 UTC).
    # The CronJob has already scaled all replicas to zero, so every node is
    # empty and can be terminated simultaneously with no workload impact.
    - nodes: "100%"
      schedule: "0 18 * * 5"
      duration: 62h
  limits:
    cpu: 1000
    memory: 1000Gi
  template:
    metadata:
      labels:
        intent: weekend-scaling
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        name: weekend-scaling
        kind: EC2NodeClass
      expireAfter: 720h
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values: ["c", "m", "r"]
      - key: karpenter.k8s.aws/instance-size
        operator: NotIn
        values: ["nano", "micro", "small", "medium"]
      - key: karpenter.k8s.aws/instance-hypervisor
        operator: In
        values: ["nitro"]
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64", "arm64"]
      - key: kubernetes.io/os
        operator: In
        values: ["linux"]
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: weekend-scaling
spec:
  amiSelectorTerms:
  - alias: al2023@latest
  role: "<<KARPENTER_NODE_IAM_ROLE_NAME>>"
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: <<CLUSTER_NAME>>
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: <<CLUSTER_NAME>>
