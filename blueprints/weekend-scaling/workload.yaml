apiVersion: v1
kind: ServiceAccount
metadata:
  name: weekend-scaler
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weekend-scaler
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weekend-scaler
  namespace: default
subjects:
- kind: ServiceAccount
  name: weekend-scaler
  namespace: default
roleRef:
  kind: Role
  name: weekend-scaler
  apiGroup: rbac.authorization.k8s.io
---
# Scale the workload to 0 replicas every Friday at 18:00 UTC.
# With no pending pods, Karpenter consolidation will drain and terminate nodes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekend-scale-down
  namespace: default
spec:
  schedule: "0 18 * * 5"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: weekend-scaler
          restartPolicy: OnFailure
          containers:
          - name: scaler
            image: bitnami/kubectl:1.34
            command:
            - kubectl
            - scale
            - deployment/weekend-scaling-workload
            - --replicas=0
            - -n
            - default
---
# Restore replicas every Monday at 08:00 UTC so Karpenter provisions nodes again.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekend-scale-up
  namespace: default
spec:
  schedule: "0 8 * * 1"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: weekend-scaler
          restartPolicy: OnFailure
          containers:
          - name: scaler
            image: bitnami/kubectl:1.34
            command:
            - kubectl
            - scale
            - deployment/weekend-scaling-workload
            - --replicas=5
            - -n
            - default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weekend-scaling-workload
  namespace: default
spec:
  replicas: 5
  selector:
    matchLabels:
      intent: weekend-scaling
  template:
    metadata:
      labels:
        intent: weekend-scaling
    spec:
      nodeSelector:
        intent: weekend-scaling
      containers:
      - name: app
        image: public.ecr.aws/eks-distro/kubernetes/pause:v1.33.0-eks-1-33-4
        resources:
          requests:
            cpu: 512m
            memory: 512Mi
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            intent: weekend-scaling
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      - labelSelector:
          matchLabels:
            intent: weekend-scaling
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
