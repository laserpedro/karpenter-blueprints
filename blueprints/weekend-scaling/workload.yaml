apiVersion: apps/v1
kind: Deployment
metadata:
  name: weekend-scaling-workload
  namespace: default
spec:
  selector:
    matchLabels:
      intent: weekend-scaling
  template:
    metadata:
      labels:
        intent: weekend-scaling
    spec:
      nodeSelector:
        intent: weekend-scaling
      containers:
      - name: app
        image: public.ecr.aws/eks-distro/kubernetes/pause:v1.33.0-eks-1-33-4
        resources:
          requests:
            cpu: 512m
            memory: 512Mi
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            intent: weekend-scaling
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      - labelSelector:
          matchLabels:
            intent: weekend-scaling
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
---
# KEDA manages the replica count via an HPA it creates internally.
# During the active window (Mon 08:00 → Fri 18:00 UTC) the Deployment runs at
# desiredReplicas. Outside that window KEDA scales it to minReplicaCount (0),
# emptying the nodes so Karpenter's consolidation can terminate them.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: weekend-scaling-workload
  namespace: default
spec:
  scaleTargetRef:
    name: weekend-scaling-workload
  minReplicaCount: 0
  maxReplicaCount: 5
  triggers:
  - type: cron
    metadata:
      timezone: UTC
      start: "0 8 * * 1"   # Monday 08:00 UTC — scale up to desiredReplicas
      end: "0 18 * * 5"    # Friday 18:00 UTC — scale down to minReplicaCount (0)
      desiredReplicas: "5"
